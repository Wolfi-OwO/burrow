name: Build image

# One image, built and pushed. Called by the release workflow once per component that actually needs a new image;
# a component whose inputs did not change is never built (the release reuses the image that already exists).

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from
        type: string
        required: true
      image:
        description: Image name below the registry, e.g. burrow-api
        type: string
        required: true
      tag:
        description: Tag to push
        type: string
        required: true
      context:
        type: string
        required: true
      file:
        description: Dockerfile path; empty means <context>/Dockerfile
        type: string
        default: ""
      cache-scope:
        type: string
        required: true
      build-args:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ghcr.io/wolfi-owo/${{ inputs.image }}:${{ inputs.tag }}
          build-args: ${{ inputs.build-args }}
          # No provenance or SBOM attestations: they are extra untagged registry entries nobody reads.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max
