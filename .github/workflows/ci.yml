name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      # No apps/api, apps/ai-server or ui-prototype jobs here yet — unlike
      # nutrilens, none of those exist in this repo. Add them back once the
      # relevant app scaffolding lands (M1 for prototype/, M3+ for apps/*).
      - name: Check for AI-attribution trailers in the commit range
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            # First push of a branch, or workflow_dispatch: no prior sha to
            # diff against, so just check the tip commit.
            RANGE="${{ github.sha }}"
            RANGE="-1 $RANGE"
          fi

          PATTERN='co-authored-by:.*(claude|anthropic|copilot|chatgpt|gpt-|gemini)|generated with \[claude|assisted-by:|generated-by:|written-by:'

          if git log --format=%B $RANGE | grep -iE "$PATTERN"; then
            echo "::error::AI-attribution trailer found in the commit range."
            exit 1
          fi
          echo "No AI-attribution trailers found."
