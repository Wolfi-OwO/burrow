name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository this change touches. A job whose files did not change is skipped, which counts as
  # passed for branch protection; hygiene and the secret scan always run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      vision: ${{ steps.diff.outputs.vision }}
      runtime: ${{ steps.diff.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE" 2>/dev/null; then BASE="$BEFORE"
          else BASE=""; fi

          if [ -z "$BASE" ]; then
            # Nothing to compare with (manual run, first push): run everything.
            WEB=true; VISION=true
          else
            FILES="$(git diff --name-only "$BASE" HEAD)"
            printf '%s\n' "$FILES" | grep -Eq '^(apps/api/|apps/frontend/|e2e/|package(-lock)?\.json$|\.nvmrc$|eslint\.config\.mjs$|docker-compose\.yml$|\.github/workflows/ci\.yml$)' && WEB=true || WEB=false
            printf '%s\n' "$FILES" | grep -Eq '^(apps/vision/|\.github/workflows/ci\.yml$)' && VISION=true || VISION=false
          fi
          if [ "$WEB" = true ] || [ "$VISION" = true ]; then RUNTIME=true; else RUNTIME=false; fi
          printf 'web=%s\nvision=%s\nruntime=%s\n' "$WEB" "$VISION" "$RUNTIME" | tee -a "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check for AI-attribution trailers in the commit range
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            # First push of a branch, or workflow_dispatch: no prior sha to
            # diff against, so just check the tip commit.
            RANGE="${{ github.sha }}"
            RANGE="-1 $RANGE"
          fi

          PATTERN='co-authored-by:.*(claude|anthropic|copilot|chatgpt|gpt-|gemini)|generated with \[claude|assisted-by:|generated-by:|written-by:'

          if git log --format=%B $RANGE | grep -iE "$PATTERN"; then
            echo "::error::AI-attribution trailer found in the commit range."
            exit 1
          fi
          echo "No AI-attribution trailers found."

  api:
    name: apps/api and apps/frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: burrow
          POSTGRES_DB: burrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burrow -d burrow -h 127.0.0.1"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://burrow:burrow@127.0.0.1:5432/burrow
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      BLOB_DIR: ./data-test
      LOG_LEVEL: silent
      NODE_ENV: test
      MAX_UPLOAD_MB: "1"
      LOGIN_RATE_LIMIT_MAX: "1000"
      API_RATE_LIMIT_MAX: "100000"
      UPLOAD_RATE_LIMIT_MAX: "100000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check apps e2e eslint.config.mjs
      - run: npm run typecheck
      - run: npm run build -w apps/frontend
      - run: npm run database:migrate -w apps/api
      - run: npm test -w apps/api

  vision:
    name: apps/vision
    needs: changes
    if: needs.changes.outputs.vision == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/vision/requirements*.txt

      # The export downloads and converts ~600 MB of weights; cache the result by the inputs that define it.
      - name: Cache exported models
        id: models
        uses: actions/cache@v5
        with:
          path: apps/vision/models
          key: vision-models-${{ hashFiles('apps/vision/scripts/export_models.py', 'apps/vision/requirements-export.txt') }}

      - name: Export the models
        if: steps.models.outputs.cache-hit != 'true'
        working-directory: apps/vision
        run: |
          pip install -r requirements-export.txt
          python scripts/export_models.py

      - name: Test
        working-directory: apps/vision
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [changes, api, vision]
    # Skipped jobs are fine; a failed one, or nothing that runs in the stack changed, is not a reason to start it.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.runtime == 'true' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4

      - name: Build the images
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
        run: |
          cp .env.example .env
          docker compose build

      - name: Start the stack
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          # A token on both services, so the API-to-vision handshake is exercised (it was once never sent).
          INTERNAL_SERVICE_TOKEN: ci-service-token
          # The plain test image must still land in the review queue; the floor itself is unit tested.
          REVIEW_FLOOR: '0.0001'
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test
        env:
          BASE_URL: http://localhost:8080
        run: node --test e2e/smoke.test.mjs

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200
