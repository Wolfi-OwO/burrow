name: Feature request
description: Suggest an idea for burrow
labels: ["type:feature"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "apps/api"
        - "apps/vision"
        - "apps/frontend"
        - "packages/shared"
        - "prototype"
        - "cross-cutting"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
