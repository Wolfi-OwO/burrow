version: 2

# Monthly, and a single pull request for everything: the multi-ecosystem group folds npm, pip, Docker and the
# workflow actions into one PR per month. Majors stay ignored for the language ecosystems, where they are real
# migrations; Action bumps are always major (v4 -> v5), so those are not ignored.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: monthly
    patterns: ['*']

  - package-ecosystem: pip
    directory: /apps/vision
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/vision
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/api
    multi-ecosystem-group: monthly
    patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
